name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install PyYAML jsonschema referencing tzdata pytest
      - name: Run tests
        run: python -m pytest -q
