# Cấu hình harness (PR-1a).
# MỌI CON SỐ DƯỚI ĐÂY LÀ MẶC ĐỊNH TẠM (R16), KHÔNG PHẢI YÊU CẦU. Chỉnh theo dữ liệu thật.
schema_version: 1

# Runtime state nằm NGOÀI repo (R13). Ghi đè bằng biến môi trường HARNESS_STATE_DIR.
# Trên máy này: C:\Users\water\AppData\Local\harness. Phải đổi khi tách OS user.
state_dir: "%LOCALAPPDATA%\\harness"

# Mọi thời điểm theo KST (R17; Windows cần gói tzdata).
timezone: Asia/Seoul

# Vòng fix, cộng dồn theo task_id, không reset khi mở PR mới (R2).
fix_loop:
  max_fix_rounds: 2        # N = 2 (mặc định tạm)
  budget_multiplier: 3.0   # chi phí các attempt sửa <= 3x chi phí attempt đầu (mặc định tạm)
  fingerprint_line_window: 10  # PR-3: fingerprint finding = (file, loại, vùng 10 dòng) (mặc định tạm)

# Ghi nguyên tử write-temp + os.replace, retry khi reader giữ file (R3).
atomic_write:
  max_attempts: 8
  backoff_initial_s: 0.05
  backoff_max_s: 0.5

# Số byte tối đa của dòng hỏng được giữ lại trong vùng cách ly.
quarantine_max_raw_bytes: 4096

prices_path: config/prices.yaml

# --- PR-1b ---
# Worktree theo task-attempt, tên <task>-<attempt> (R6). Root ngắn, ngoài repo, để
# tránh giới hạn độ dài đường dẫn Windows. Ghi đè bằng HARNESS_WORKTREE_ROOT.
worktree:
  root: "%LOCALAPPDATA%\\hw"
  max_root_len: 80         # mặc định tạm

# Heartbeat agent (R16: mặc định tạm, chỉnh theo dữ liệu thật).
heartbeat:
  interval_s: 15           # agent ghi heartbeat mỗi 15 giây
  timeout_s: 120           # quá 120 giây không có heartbeat mới thì stale

# --- PR-3 ---
# Gate 3 tự động (pipeline/gate3.py, R11, R16). Đúng 1 reviewer. Reviewer không bao giờ
# trùng model trong writer set (model THỰC SỰ phục vụ, từ ledger); Red/Owner-only luôn
# khác vendor. Ứng viên theo thứ tự ưu tiên, mỗi ứng viên MỘT model, không fallback.
# Không còn ứng viên hợp lệ thì task vào escalated. Stub (Codex/Cursor) không bao giờ là
# reviewer.
gate3:
  reviewer_agent: gate3
  green_rule: model        # Green: khác model là đủ (mặc định đề xuất, SPEC mục 8 câu 10)
  max_diff_bytes: 400000   # diff lớn hơn thì escalated, không review một phần (mặc định tạm)
  candidates:
    - {adapter: dsh, model: deepseek-v4.1-flash-1017}
    - {adapter: claude, model: claude-opus-5-5, effort: high}
    - {adapter: agy, model: gemini-3.8-flash-medium}

# GitHub: nguồn sự thật cho CI (check run GitHub Actions) và bản ghi duyệt (R7, R14).
# Chỉ ghi TÊN biến môi trường chứa token, không bao giờ ghi token.
github:
  repo: suanlong06/Agents
  owner_logins: [suanlong06]   # người dùng (CODEOWNERS); chỉ review của họ là bản ghi duyệt
  token_env: GITHUB_TOKEN
  required_check: ci
  actions_app_slug: github-actions

# --- PR-4a ---
# Kill-switch fail-closed (orchestrator/killswitch.py, R8, R15). File JSON NGOÀI repo;
# đường dẫn tương đối tính từ state_dir. Thiếu file, không đọc được hay sai định dạng thì
# coi như ĐANG BẬT: mọi hành động tự động dừng. Chỉ người dùng đổi file này, bằng tay
# (docs/runbooks/release.md); không qua dashboard. Best-effort, không chống giả mạo.
killswitch:
  file: killswitch.json

# Shadow evaluator (release/shadow_eval.py). CHỈ ghi "would-merge" vào audit, không bao
# giờ merge; auto-merge vẫn TẮT trong MVP. 4 điều kiện là OPEN DISCUSSION (SPEC mục 8).
# Ngưỡng shadow trước khi XEM XÉT bật auto-merge (PR-4b): 2 tuần hoặc 20 PR (mặc định tạm).
shadow:
  min_days: 14
  min_prs: 20

# Kiểm tra read-only ở bước 11 (release/readonly_check.py, SPEC mục 8 câu 14).
readonly_check:
  max_new_errors: 0        # số bản ghi audit lỗi mới tối đa sau release (mặc định tạm)

# --- PR-4b ---
# Lịch KST (release/schedule.py, release/runner.py). MỌI MỐC GIỜ LÀ MẶC ĐỊNH TẠM (R16).
# enabled: false — PR-4b KHÔNG kích hoạt lịch chạy thật. Bật là quyết định riêng của người dùng
# sau khi merge (docs/runbooks/batch.md). Runner chạy dưới OS user hiện tại: tách OS user + ACL
# trên thư mục state vẫn là điều kiện triển khai còn mở trước mọi auto-merge hay ghi từ dashboard.
scheduler:
  enabled: false
  tick_s: 30
  grace_minutes: 10        # quá 10 phút sau mốc mà chưa chạy → lỡ cửa sổ: bỏ qua và thông báo
  windows:
    - {digest: "11:30", cutoff: "11:55", batch: "12:00"}
    - {digest: "16:30", cutoff: "16:55", batch: "17:00"}

# Batch release (release/batch.py). KHÔNG CÓ AUTO-MERGE: batch chỉ merge PR có review APPROVED
# của người dùng trên GitHub gắn (head SHA, patch-id), nộp trước hạn duyệt (cutoff).
batch:
  max_prs: 5               # số PR tối đa mỗi batch (mặc định tạm, SPEC mục 8)
  remote: origin
  base_branch: main
  workdir: "%LOCALAPPDATA%\\hw\\rel"   # clone làm việc riêng của batch, ngoài repo (người dùng tạo)
  # Allowlist danh tính GitHub được merge trong batch. RỖNG = batch không merge gì (fail-closed).
  # Danh tính merge phải khác tác giả PR. Token đọc từ biến môi trường, không bao giờ ghi vào file.
  merge_identities: []
  merge_token_env: HARNESS_MERGE_TOKEN
  merge_method: merge
  ci_timeout_minutes: 60   # chờ CI trên kết quả tích hợp (mặc định tạm)
  ci_poll_s: 30
  check_timeout_minutes: 15
  integration_prefix: harness/batch/
  revert_prefix: revert/
  tag_prefix: rel-
