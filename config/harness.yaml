# Cấu hình harness (PR-1a).
# MỌI CON SỐ DƯỚI ĐÂY LÀ MẶC ĐỊNH TẠM (R16), KHÔNG PHẢI YÊU CẦU. Chỉnh theo dữ liệu thật.
schema_version: 1

# Runtime state nằm NGOÀI repo (R13). Ghi đè bằng biến môi trường HARNESS_STATE_DIR.
# Trên máy này: C:\Users\water\AppData\Local\harness. Phải đổi khi tách OS user.
state_dir: "%LOCALAPPDATA%\\harness"

# Mọi thời điểm theo KST (R17; Windows cần gói tzdata).
timezone: Asia/Seoul

# Vòng fix, cộng dồn theo task_id, không reset khi mở PR mới (R2).
fix_loop:
  max_fix_rounds: 2        # N = 2 (mặc định tạm)
  budget_multiplier: 3.0   # chi phí các attempt sửa <= 3x chi phí attempt đầu (mặc định tạm)
  fingerprint_line_window: 10  # PR-3: fingerprint finding = (file, loại, vùng 10 dòng) (mặc định tạm)

# Ghi nguyên tử write-temp + os.replace, retry khi reader giữ file (R3).
atomic_write:
  max_attempts: 8
  backoff_initial_s: 0.05
  backoff_max_s: 0.5

# Số byte tối đa của dòng hỏng được giữ lại trong vùng cách ly.
quarantine_max_raw_bytes: 4096

prices_path: config/prices.yaml

# --- PR-1b ---
# Worktree theo task-attempt, tên <task>-<attempt> (R6). Root ngắn, ngoài repo, để
# tránh giới hạn độ dài đường dẫn Windows. Ghi đè bằng HARNESS_WORKTREE_ROOT.
worktree:
  root: "%LOCALAPPDATA%\\hw"
  max_root_len: 80         # mặc định tạm

# Heartbeat agent (R16: mặc định tạm, chỉnh theo dữ liệu thật).
heartbeat:
  interval_s: 15           # agent ghi heartbeat mỗi 15 giây
  timeout_s: 120           # quá 120 giây không có heartbeat mới thì stale

# --- PR-3 ---
# Gate 3 tự động (pipeline/gate3.py, R11, R16). Đúng 1 reviewer. Reviewer không bao giờ
# trùng model trong writer set (model THỰC SỰ phục vụ, từ ledger); Red/Owner-only luôn
# khác vendor. Ứng viên theo thứ tự ưu tiên, mỗi ứng viên MỘT model, không fallback.
# Không còn ứng viên hợp lệ thì task vào escalated. Stub (Codex/Cursor) không bao giờ là
# reviewer.
gate3:
  reviewer_agent: gate3
  green_rule: model        # Green: khác model là đủ (mặc định đề xuất, SPEC mục 8 câu 10)
  max_diff_bytes: 400000   # diff lớn hơn thì escalated, không review một phần (mặc định tạm)
  candidates:
    - {adapter: dsh, model: deepseek-v4.1-flash-1017}
    - {adapter: claude, model: claude-opus-5-5, effort: high}
    - {adapter: agy, model: gemini-3.8-flash-medium}

# GitHub: nguồn sự thật cho CI (check run GitHub Actions) và bản ghi duyệt (R7, R14).
# Chỉ ghi TÊN biến môi trường chứa token, không bao giờ ghi token.
github:
  repo: suanlong06/Agents
  owner_logins: [suanlong06]   # người dùng (CODEOWNERS); chỉ review của họ là bản ghi duyệt
  token_env: GITHUB_TOKEN
  required_check: ci
  actions_app_slug: github-actions
